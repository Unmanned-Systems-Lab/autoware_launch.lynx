/**:
  ros__parameters:
    # -- Node Configurations --
    planning_algorithm: "astar"
    waypoints_velocity: 3.5
    update_rate: 10.0
    th_arrived_distance_m: 0.3
    th_stopped_time_sec: 1.0
    th_stopped_velocity_mps: 0.03
    th_course_out_distance_m: 1.0
    th_obstacle_time_sec: 1.0
    vehicle_shape_margin_m: 0.4
    replan_when_obstacle_found: true
    replan_when_course_out: true

    # -- Configurations common to the all planners --
    # base configs
    time_limit: 7000.0
    # robot configs # TODO replace by vehicle_info
    max_turning_ratio: 0.9 # ratio of actual turning limit of vehicle
    turning_steps: 2
    # search configs
    theta_size: 96
    angle_goal_range: 8.0
    lateral_goal_range: 0.6
    longitudinal_goal_range: 1.0
    curve_weight: 0.8
    reverse_weight: 0.8
    direction_change_weight: 3.0
    # costmap configs
    obstacle_threshold: 100

    # -- A* search Configurations --
    astar:
      search_method: "forward"  # options: forward, backward
      only_behind_solutions: false
      use_back: true
      adapt_expansion_distance: true
      expansion_distance: 0.8
      near_goal_distance: 4.0
      distance_heuristic_weight: 3.0
      smoothness_weight: 1.0
      obstacle_distance_weight: 1.8
      goal_lat_distance_weight: 4.0

    # -- RRT* search Configurations --
    rrtstar:
      enable_update: false
      use_informed_sampling: true
      max_planning_time: 400.0
      neighbor_radius: 5.0
      margin: 0.2
